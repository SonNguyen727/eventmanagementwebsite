<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Event Management</title>
</head>
<body class="register-page">
  <div class="register-wrapper" id="register-wrapper">
    <div class="register-container">
    <h2>Register</h2>
    <p>Create your account to manage events.</p>
    <form id="register-form">
      <div class="form-message" id="register-message"></div>
      <label for="reg-name" class="sr-only">Full Name</label>
      <input type="text" id="reg-name" placeholder="Full Name" aria-label="Full Name" required>
      <label for="reg-email" class="sr-only">Email</label>
      <input type="email" id="reg-email" placeholder="Email" aria-label="Email address" required>
      <label for="reg-password" class="sr-only">Password</label>
      <input type="password" id="reg-password" placeholder="Password" aria-label="Password" required minlength="6">
      <label for="reg-phone" class="sr-only">Phone</label>
      <input type="tel" id="reg-phone" placeholder="Phone" aria-label="Phone number">
      <button type="submit">Create Account</button>
      <p class="login-link"><a href="#" onclick="loadPage('login'); return false;">Already have an account? Login</a></p>
    </form>
  </div>
  </div>

  <script>
(function() {
  function adjustRegisterHeight() {
    const header = document.querySelector('my-header');
    const footer = document.querySelector('my-footer');
    const wrapper = document.getElementById('register-wrapper');
    const headerHeight = header ? header.offsetHeight : 0;
    const footerHeight = footer ? footer.offsetHeight : 0;
    if (wrapper) {
      wrapper.style.minHeight = (window.innerHeight - headerHeight - footerHeight) + 'px';
    }
  }
  adjustRegisterHeight();
  window.addEventListener('resize', adjustRegisterHeight);

  const form = document.getElementById('register-form');
  const msgEl = document.getElementById('register-message');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    msgEl.textContent = '';
    msgEl.className = 'form-message';

    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    const phone = document.getElementById('reg-phone').value.trim();

    if (!name || !email || !password) {
      msgEl.textContent = 'Please fill in all required fields.';
      msgEl.classList.add('error');
      return;
    }

    if (password.length < 6) {
      msgEl.textContent = 'Password must be at least 6 characters.';
      msgEl.classList.add('error');
      return;
    }

    const result = DB.register(name, email, password, phone);
    if (result.success) {
      msgEl.textContent = result.message + ' Redirecting to login...';
      msgEl.classList.add('success');
      form.reset();
      setTimeout(() => loadPage('login'), 1200);
    } else {
      msgEl.textContent = result.message;
      msgEl.classList.add('error');
    }
  });
})();
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .register-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: url(/assets/netherlands-national-football-team-determination-6zyc87madrkwpx7y.jpg);
      color: #333;
    }

    .register-container {
      background: white;
      padding: clamp(2rem, 5vw, 3rem);
      margin: 30px 0 30px 0;
      width: min(90%, 400px);
      text-align: center;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    }

    h2 {
      margin: 0 0 0.5rem 0;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      color: #000;
    }

    p {
      margin: 0 0 2rem 0;
      color: #666;
      font-size: 1rem;
    }

    #register-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .form-message {
      font-size: 0.9rem;
      min-height: 1.2em;
      margin-bottom: 0.25rem;
    }

    .form-message.error {
      color: #dc2626;
    }

    .form-message.success {
      color: #16a34a;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="tel"] {
      width: 100%;
      padding: clamp(12px, 3vw, 16px);
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: clamp(16px, 4vw, 18px);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="password"]:focus,
    input[type="tel"]:focus {
      outline: none;
      border-color: #1e3a8a;
      box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1);
    }

    button {
      background: rgb(242,58,46);
      color: white;
      width: 100%;
      padding: clamp(14px, 4vw, 18px);
      border: none;
      border-radius: 8px;
      font-size: clamp(16px, 4vw, 18px);
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      min-height: 48px;
    }

    button:active {
      transform: scale(0.98);
    }

    .login-link {
      margin: 1.5rem 0 0 0;
    }

    .login-link a {
      color: #000;
      text-decoration: none;
      font-size: clamp(14px, 3.5vw, 16px);
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .register-container {
        margin: 1rem;
        width: calc(100% - 2rem);
      }
    }

    @media (max-width: 480px) {
      .register-container {
        padding: 1.5rem;
      }

      input[type="text"],
      input[type="email"],
      input[type="password"],
      input[type="tel"] {
        min-height: 48px;
      }
    }

    @media (max-width: 360px) {
      .register-container {
        width: 95%;
        padding: 1.25rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</body>
</html>
