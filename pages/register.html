<h2>Register</h2>
<p>Create your account to manage events.</p>
<form id="register-form">
  <input type="text" id="reg-name" placeholder="Full Name" required><br><br>
  <input type="email" id="reg-email" placeholder="Email" required><br><br>
  <input type="password" id="reg-password" placeholder="Password" required><br><br>
  <input type="tel" id="reg-phone" placeholder="Phone"><br><br>
  <button type="submit">Create Account</button>
</form>

<script>
document.getElementById('register-form').addEventListener('submit', (e) => {
  e.preventDefault();
  alert('Registration successful! Welcome aboard.');
  loadPage('home');
});
</script>

<style>
#register-form { max-width: 400px; }
input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #1e3a8a; border-radius: 4px; box-sizing: border-box; }
button { background: #10b981; color: white; width: 100%; padding: 12px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
</style>
