<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Event Management</title>
</head>
<body class="login-page">
  <div class="login-wrapper" id="login-wrapper">
    <div class="login-container">
    <h2>Login</h2>
    <p>Sign in to your account.</p>
    <form id="login-form">
      <label for="login-email" class="sr-only">Email</label>
      <input type="email" id="login-email" placeholder="Email" aria-label="Email address" required>
      <label for="login-password" class="sr-only">Password</label>
      <input type="password" id="login-password" placeholder="Password" aria-label="Password" required>
      <label class="checkbox-label" for="remember">
        <input type="checkbox" id="remember"> Remember me
      </label>
      <button type="submit">Sign In</button>
      <p class="register-link"><a href="#" onclick="loadPage('register'); return false;">No account? Register</a></p>
    </form>
  </div>
  </div>

  <script>
(function() {
  function adjustLoginHeight() {
    const header = document.querySelector('my-header');
    const footer = document.querySelector('my-footer');
    const wrapper = document.getElementById('login-wrapper');
    const headerHeight = header ? header.offsetHeight : 0;
    const footerHeight = footer ? footer.offsetHeight : 0;
    if (wrapper) {
      wrapper.style.minHeight = (window.innerHeight - headerHeight - footerHeight) + 'px';
    }
  }
  adjustLoginHeight();
  window.addEventListener('resize', adjustLoginHeight);

  document.getElementById('login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    alert('Login successful!');
    loadPage('home');
  });
})();
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .login-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: url(/assets/netherlands-national-football-team-determination-6zyc87madrkwpx7y.jpg);
      color: #333;
    }

    .login-container {
      background: white;
      padding: clamp(2rem, 5vw, 3rem);
      margin: 30px 0 30px 0;
      width: min(90%, 400px);
      text-align: center;
    }

    h2 {
      margin: 0 0 0.5rem 0;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      color: #000;
    }

    p {
      margin: 0 0 2rem 0;
      color: #666;
      font-size: 1rem;
    }

    #login-form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: clamp(12px, 3vw, 16px);
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: clamp(16px, 4vw, 18px);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #1e3a8a;
      box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      font-size: clamp(14px, 3.5vw, 16px);
      cursor: pointer;
      margin: 0.5rem 0;
    }

    .checkbox-label input[type="checkbox"] {
      width: auto;
      margin-right: 0.5rem;
      transform: scale(1.2);
    }

    button {
      background: rgb(242,58,46);
      color: white;
      width: 100%;
      padding: clamp(14px, 4vw, 18px);
      border: none;
      border-radius: 8px;
      font-size: clamp(16px, 4vw, 18px);
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      min-height: 48px; /* Touch-friendly */
    }


    button:active {
      transform: scale(0.98);
    }

    .register-link {
      margin: 1.5rem 0 0 0;
    }

    .register-link a {
      color: #000;
      text-decoration: none;
      font-size: clamp(14px, 3.5vw, 16px);
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    /* Tablet adjustments */
    @media (max-width: 768px) {
      .login-container {
        margin: 1rem;
        width: calc(100% - 2rem);
      }
    }

    /* Mobile adjustments */
    @media (max-width: 480px) {
      .login-container {
        padding: 1.5rem;
      }

      input[type="email"],
      input[type="password"] {
        min-height: 48px; /* Touch-friendly */
      }

      .checkbox-label {
        font-size: 16px; /* Prevent zoom on iOS */
      }
    }

    @media (max-width: 360px) {
      .login-container {
        width: 95%;
        padding: 1.25rem;
      }
    }

    /* Accessibility: Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</body>
</html>
