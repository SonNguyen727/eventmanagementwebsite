<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportz Template</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Reset cơ bản */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f4f4;
        }

        /* --- Thanh Top Bar (Email, Phone, Social) --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5%;
            background-color: #ffffff;
            color: #666;
            font-size: 14px;
            height: 40px;
        }

        .social-icons a {
            color: #666;
            margin-right: 15px;
            text-decoration: none;
            font-size: 16px;
        }

        .social-icons a:hover {
            color: #e53935;
        }

        .contact-info {
            display: flex;
            gap: 20px;
        }

        .contact-info i {
            margin-right: 8px;
        }

        /* --- Thanh Điều Hướng (Navigation Bar) --- */
        .navbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            background-color: #000000;
            padding: 0 5%;
            height: 70px;
            position: relative;
        }

        /* Logo giả lập hình chiếc khiên */
        .logo-container {
            position: absolute;
            left: 5%;
            top: -20px; /* Nhô lên trên thanh top-bar */
            background-color: #f44336;
            width: 100px;
            height: 110px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 0 0 50% 50%;
            border: 4px solid #fff; /* Viền trắng như trong ảnh */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .logo-container h1 {
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-top: -10px;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        .nav-links li {
            position: relative;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            transition: color 0.3s ease;
        }

        /* Nút Home màu đỏ */
        .nav-links .active a {
            color: #f44336;
        }

        .nav-links a:hover {
            color: #f44336;
        }

        .nav-links i {
            font-size: 10px;
            margin-left: 5px;
        }

        /* --- Phần Hero Banner (Hình ảnh lớn) --- */
        .hero-section {
            /* THAY THẾ URL BẰNG HÌNH ẢNH CỦA BẠN */
            background-image: url('https://via.placeholder.com/1920x800/333333/ffffff?text=Background+Image+(Replace+Me)'); 
            background-size: cover;
            background-position: center;
            height: 600px;
            display: flex;
            align-items: center;
            padding: 0 5%;
            position: relative;
        }

        /* Lớp phủ mờ (tùy chọn để chữ dễ đọc hơn) */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 600px;
        }

        /* Tiêu đề nền đen */
        .hero-title {
            font-size: 55px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .hero-title span {
            background-color: #000000;
            padding: 5px 20px;
            display: inline-block;
            margin-bottom: 5px; /* Khoảng cách giữa 2 dòng nền đen */
        }

        /* Nút Read More */
        .btn-read-more {
            background-color: #f44336;
            color: #ffffff;
            padding: 15px 30px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            display: inline-block;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-read-more:hover {
            background-color: #d32f2f;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="social-icons">
            <a href="#"><i class="fab fa-facebook-f"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-twitter"></i></a>
            <a href="#"><i class="fab fa-linkedin-in"></i></a>
        </div>
        <div class="contact-info">
            <span><i class="fas fa-envelope"></i> youremail@domain.com</span>
            <span><i class="fas fa-phone"></i> +1 232 3532 321</span>
        </div>
    </div>

    <nav class="navbar">
        <div class="logo-container">
            <h1>sportz</h1>
        </div>
        <ul class="nav-links">
            <li class="active"><a href="#">HOME <i class="fas fa-chevron-down"></i></a></li>
            <li><a href="#">NEWS <i class="fas fa-chevron-down"></i></a></li>
            <li><a href="#">MATCHES</a></li>
            <li><a href="#">TEAM</a></li>
            <li><a href="#">ABOUT</a></li>
            <li><a href="#">CONTACT</a></li>
        </ul>
    </nav>

    <section class="hero-section">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h2 class="hero-title">
                <span>Russia's World Cup</span><br>
                <span>Championship</span>
            </h2>
            <a href="#" class="btn-read-more">READ MORE</a>
        </div>
    </section>

</body>
</html>
